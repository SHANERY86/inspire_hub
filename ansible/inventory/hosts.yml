# Host vars: where the app lives on disk, and lowercase GitHub owner for ghcr.io/<owner>/… images.
# SSH password login: ansible-playbook … --ask-pass (needs sshpass on the controller).
# Sudo: ansible_become_password (ansible-vault); use --ask-vault-pass or --vault-password-file.
# Private GHCR: ghcr_token (ansible-vault); optional -e ghcr_token=… overrides for one-off runs.
# First-time .env: vaulted ocr_api_key + django_key required. DB_PASSWORD = ansible_become_password. Optional:
#   inspire_db_user (default: ansible_user), inspire_db_name (default: inspire_hub),
#   inspire_allowed_hosts, inspire_csrf_origins (override if needed; template defaults include :8080 for CSRF),
#   inspire_url_path_prefix (e.g. inspire-hub), inspire_static_url, inspire_media_url, django_debug.
#   inspire_dev_logging: true — INSPIRE_DEV_LOGGING in .env (HTTP access + SQL to backend logs).
#   silk_enabled: true — SILK_ENABLED in .env (Silk UI at /<prefix>/silk/, staff only; turn off after debugging).
# Outbound Gmail (signup requests): vaulted `gmail_pass` → templates/env.j2 sets SMTP + shanery86@gmail.com.
# Deploy tags (cd ansible): --tags db | backend | frontend | stack | full ; default = full stack.
# Postgres phase also with: -e deploy_db=true (with default full deploy).

